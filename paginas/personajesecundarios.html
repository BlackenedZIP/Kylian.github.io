    <style>
        .personajes-grid {
            display: flex;
            gap: 20px;
            padding: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        @keyframes aparecerCard {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .personaje-card {
            background: linear-gradient(145deg, #ffffff, #fafafa);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 280px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: aparecerCard 0.6s ease-out forwards;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .personaje-card:nth-child(1) { animation-delay: 0.1s; }
        .personaje-card:nth-child(2) { animation-delay: 0.3s; }
        .personaje-card:nth-child(3) { animation-delay: 0.5s; }
        .personaje-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #aaa5b1, #8a849e);
            transform: scaleX(0);
            transition: transform 0.4s;
        }
        .personaje-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .personaje-card:hover::before {
            transform: scaleX(1);
        }
        .personaje-card img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 4px solid transparent;
            transition: all 0.5s;
        }
        .personaje-card:hover img {
            transform: scale(1.08);
            border-color: #aaa5b1;
            box-shadow: 0 0 30px rgba(170, 165, 177, 0.4);
        }
        .personaje-card h2 {
            font-family: cursive;
            margin-bottom: 10px;
        }
        .personaje-card a {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>
